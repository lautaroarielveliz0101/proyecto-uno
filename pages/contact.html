<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Deport AR</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body>

    <main class="contacto-container">

        <!-- Imagen izquierda -->
        <div class="contacto-imagen">
          <a href="/index.html">
              <img src="../assets/img/logoNewWhite.jpg" alt="Contacto Deport AR">
            </a>

        </div>

        <!-- Formulario derecha -->
        <section class="contacto-formulario">

            <h1>Contacto</h1>

            <form action="#" method="POST">

                <!-- Nombre y correo -->
                <div class="row g-4">

                    <div class="col-md-6">
                        <label for="nombre" class="form-label">Nombre y Apellido</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            class="form-control"
                            placeholder="Gonzalo Perez"
                            required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">
                            Correo electrónico *
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="@gmail.com"
                            required>
                    </div>

                </div>

                <!-- Motivo de contacto -->
                <div class="mb-4">
                    <label for="motivo" class="form-label">
                        Motivo de contacto
                    </label>

                    <select id="motivo" name="motivo" class="form-select">
                        <option value="pedido">Información de pedido</option>
                        <option value="producto">Consulta sobre un producto</option>
                        <option value="devolucion">Cambios y devoluciones</option>
                        <option value="pago">Problemas con el pago</option>
                        <option value="otro">Otro motivo</option>
                    </select>
                </div>

                <!-- Canal de compra -->
                <div class="mb-4">
                    <label for="canal" class="form-label">
                        Canal de compra
                    </label>

                    <select id="canal" name="canal" class="form-select">
                        <option value="web">Tienda online</option>
                        <option value="local">Tienda física</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                <!-- Mensaje -->
                <div class="mb-2">
                    <label for="mensaje" class="form-label">
                        Tu mensaje
                    </label>

                    <textarea
                        id="mensaje"
                        name="mensaje"
                        class="form-control"
                        rows="5"
                        placeholder="Escribí tu mensaje..."
                        required></textarea>
                </div>

                <!-- Botón -->
                <button type="submit" class="btn-enviar">
                    ENVIAR MENSAJE
                </button>

            </form>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
