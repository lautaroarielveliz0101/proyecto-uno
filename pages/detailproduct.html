<!doctype html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Deport AR</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/img/logoNewWhite.jpg">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/detailproduct.css">

</head>


<body>


    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <nav>

        <div class="upNavbar">

            <!-- Botón hamburguesa -->

            <button
                class="hamburger"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#mobileMenu"
                aria-controls="mobileMenu"
                aria-label="Abrir menú"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="26"
                    height="26"
                    fill="currentColor"
                    viewBox="0 0 16 16"
                >

                    <path
                        d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"
                    />

                </svg>

            </button>


            <!-- Logo -->

            <a href="/index.html">

                <img
                    src="/assets/img/logoNewWhite.jpg"
                    alt="Logo Deport AR"
                >

            </a>


            <!-- Buscador -->

            <div class="search">

                <span>

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        fill="currentColor"
                        class="bi bi-search"
                        viewBox="0 0 16 16"
                    >

                        <path
                            d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"
                        />

                    </svg>

                </span>


                <input
                    type="text"
                    placeholder="   Buscar productos, cursos o eventos"
                >

            </div>


            <!-- Login -->

            <div class="login">

                <a href="/pages/login.html">

                    <button class="register1">
                        Iniciar Sesión
                    </button>

                </a>


                <a href="/pages/register.html">

                    <button class="register2">
                        Crear Cuenta
                    </button>

                </a>

            </div>


            <!-- Carrito -->

            <div class="cart">

                <a href="/pages/cart.html">

                    <button class="buttonCart">

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            fill="currentColor"
                            class="bi bi-cart-fill"
                            viewBox="0 0 16 16"
                        >

                            <path
                                d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"
                            />

                        </svg>

                    </button>

                </a>

            </div>

        </div>


        <!-- Navbar inferior -->

        <div class="downNavbar">

            <div class="menu">

                <a href="/index.html">
                    <button>INICIO</button>
                </a>

                <a href="/pages/category.html">
                    <button>CATEGORIAS</button>
                </a>

                <a href="/pages/product.html">
                    <button>EQUIPAMIENTO</button>
                </a>

                <a href="/pages/training.html">
                    <button>FORMACION</button>
                </a>

                <a href="/pages/events.html">
                    <button>EVENTOS</button>
                </a>

            </div>


            <div class="menu2">

                <a href="/pages/aboutUs.html">
                    Nosotros
                </a>

                <a href="/pages/contact.html">
                    Contacto
                </a>

            </div>

        </div>

    </nav>



    <!-- ========================= -->
    <!-- MENÚ MOBILE -->
    <!-- ========================= -->

    <div
        class="offcanvas offcanvas-start d-lg-none mobileMenu"
        tabindex="-1"
        id="mobileMenu"
        aria-labelledby="mobileMenuLabel"
    >

        <div class="offcanvas-header">

            <h5
                class="offcanvas-title"
                id="mobileMenuLabel"
            >
                Menú
            </h5>


            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Cerrar"
            ></button>

        </div>


        <div class="offcanvas-body d-flex flex-column">

            <ul class="mobileLinks">

                <li>

                    <a href="/pages/category.html">
                        <button>CATEGORIAS</button>
                    </a>

                </li>


                <li>

                    <a href="/pages/product.html">
                        <button>EQUIPAMIENTO</button>
                    </a>

                </li>


                <li>

                    <a href="/pages/training.html">
                        <button>FORMACION</button>
                    </a>

                </li>


                <li>

                    <a href="/pages/events.html">
                        <button>EVENTOS</button>
                    </a>

                </li>

            </ul>


            <div class="mobileLogin">

                <a href="/pages/login.html">

                    <button class="register1">
                        Iniciar Sesión
                    </button>

                </a>


                <a href="/pages/register.html">

                    <button class="register2">
                        Crear Cuenta
                    </button>

                </a>

            </div>

        </div>

    </div>




    <main>

        <section class="producto-seccion">

            <div class="container-fluid producto-ancho">

                <div class="row producto-layout">


                    <div class="col-lg-5 producto-galeria">

                        <div class="producto-imagen-principal">

                            <img
                                src="../assets/img/campera puma hov.webp"
                                alt="Campera Puma Run Hombre"
                            >


                            <div class="imagen-inferior">

                                <span class="calidad-imagen">
                                    HD 4K 120 FPS
                                </span>

                            </div>

                        </div>


                        <div class="producto-caracteristicas">

                            <div class="caracteristica">

                                <h3>
                                    Hombre
                                </h3>

                                <p>
                                    Género
                                </p>

                            </div>


                            <div class="caracteristica">

                                <h3>
                                    Poliester
                                </h3>

                                <p>
                                    Material
                                </p>

                            </div>


                            <div class="caracteristica">

                                <h3>
                                    Running
                                </h3>

                                <p>
                                    Disciplina
                                </p>

                            </div>

                        </div>

                    </div>




                    <div class="col-lg-7 producto-detalle">



                        <h1 class="producto-titulo">
                            Campera Puma Run Hombre
                        </h1>


                        <div class="producto-valoracion">

                            <span class="opiniones">
                                127 opiniones
                            </span>

                            <span class="valoracion-punto">
                                •
                            </span>

                        </div>


                        <p class="producto-stock">
                            ● En stock
                        </p>


                        <div class="producto-precio-card">

                            <div class="precio-principal">

                                <div class="precio-valores">

                                    <h2>
                                        $34.900
                                    </h2>

                                </div>

                            </div>


                            <div class="medios-pago">

                                <div class="pago-cuotas">

                                    <p class="pago-titulo">
                                        6 cuotas sin interés
                                    </p>

                                    <h3>
                                        $5.816
                                    </h3>

                                </div>

                            </div>


                            <div class="informacion-envio">

                                <span>
                                    🚚 Envío gratis
                                </span>

                                <span>
                                    📦 Llega en 2 a 5 días
                                </span>

                            </div>

                        </div>



                        <div class="producto-opciones">

                            <div class="opciones-encabezado">

                                <a href="#">
                                    Guía de talles
                                </a>

                            </div>


                            <div class="opciones-talle">

                                <button
                                    class="opcion-talle"
                                    type="button"
                                >

                                    <strong>
                                        S
                                    </strong>

                                </button>


                                <button
                                    class="opcion-talle seleccionada"
                                    type="button"
                                >

                                    <strong>
                                        M
                                    </strong>

                                </button>


                                <button
                                    class="opcion-talle"
                                    type="button"
                                >

                                    <strong>
                                        L
                                    </strong>

                                </button>

                            </div>

                        </div>



                        <div class="producto-compra">


                            <div class="cantidad">

                                <button type="button">
                                    −
                                </button>

                                <span>
                                    1
                                </span>

                                <button type="button">
                                    +
                                </button>

                            </div>


                            <a href="../pages/error404.html">

                                <button
                                    class="btn-comprar"
                                    type="button"
                                >
                                    COMPRAR AHORA
                                </button>

                            </a>

                        </div>




                        <div class="producto-acciones">

                            <a href="../pages/cart.html">

                                <button
                                    class="btn-carrito"
                                    type="button"
                                >
                                    Agregar al carrito
                                </button>

                            </a>

                        </div>



                        <div class="producto-codigo-postal">

                            <h3>
                                Calculá el envío a tu domicilio
                            </h3>


                            <div class="codigo-postal">

                                <input
                                    type="text"
                                    placeholder="Código postal"
                                >


                                <button type="button">
                                    CALCULAR
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxM"
        crossorigin="anonymous"
    ></script>

</body>

</html>
